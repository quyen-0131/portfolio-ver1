<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title description">
  <title id="title">The Career Experiment exploration overview concept</title>
  <desc id="description">A concept screen showing small signals from a guided evaluation and a practical next experiment.</desc>
  <rect width="1200" height="760" fill="#f5f5ee"/>
  <rect width="1200" height="82" fill="#f1f3ec"/>
  <rect x="76" y="26" width="42" height="42" rx="12" fill="#1f6c59"/>
  <text x="97" y="53" fill="#f7f6ef" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">CE</text>
  <text x="134" y="52" fill="#18362e" font-family="Arial, sans-serif" font-size="21" font-weight="700">The Career Experiment</text>
  <text x="208" y="123" fill="#657169" font-family="Arial, sans-serif" font-size="15" font-weight="700">Phase 3 of 3 · Plan your career experiment</text>
  <text x="879" y="123" fill="#657169" font-family="Arial, sans-serif" font-size="15" font-weight="700">Your overview</text>
  <rect x="208" y="139" width="784" height="5" rx="3" fill="#d7ddd5"/>
  <rect x="208" y="139" width="784" height="5" rx="3" fill="#1f6c59"/>
  <text x="208" y="208" fill="#246c58" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2">A WORKING SUMMARY</text>
  <text x="208" y="267" fill="#17362d" font-family="Georgia, serif" font-size="47">Your exploration overview</text>
  <text x="208" y="309" fill="#65716b" font-family="Arial, sans-serif" font-size="19">Use these signals to choose a small next test. They are not a score or a verdict.</text>
  <g font-family="Arial, sans-serif">
    <rect x="208" y="354" width="242" height="268" rx="13" fill="#fbfaf5" stroke="#d8ddd5" stroke-width="2"/>
    <rect x="236" y="382" width="33" height="33" rx="9" fill="#e7f1ea"/>
    <path d="M246 400h13M252.5 393.5v13" stroke="#1f6c59" stroke-width="2.3" stroke-linecap="round"/>
    <text x="236" y="452" fill="#214137" font-size="20" font-weight="700">Signals to explore</text>
    <text x="236" y="486" fill="#52625b" font-size="16">You seemed most engaged when:</text>
    <circle cx="244" cy="519" r="4" fill="#1f6c59"/>
    <text x="258" y="525" fill="#2d453b" font-size="16" font-weight="700">Making sense of user needs</text>
    <circle cx="244" cy="560" r="4" fill="#1f6c59"/>
    <text x="258" y="566" fill="#2d453b" font-size="16" font-weight="700">Structuring ambiguous problems</text>

    <rect x="479" y="354" width="242" height="268" rx="13" fill="#fbfaf5" stroke="#d8ddd5" stroke-width="2"/>
    <rect x="507" y="382" width="33" height="33" rx="9" fill="#f4efe2"/>
    <path d="M516 400l6 6 10-12" fill="none" stroke="#9b752b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="507" y="452" fill="#214137" font-size="20" font-weight="700">Keep testing</text>
    <text x="507" y="486" fill="#52625b" font-size="16">Learn more about:</text>
    <circle cx="515" cy="519" r="4" fill="#9b752b"/>
    <text x="529" y="525" fill="#2d453b" font-size="16" font-weight="700">How role-shaped work feels</text>
    <circle cx="515" cy="560" r="4" fill="#9b752b"/>
    <text x="529" y="566" fill="#2d453b" font-size="16" font-weight="700">How feedback changes your approach</text>

    <rect x="750" y="354" width="242" height="268" rx="13" fill="#e7f1ea" stroke="#c8d8cd" stroke-width="2"/>
    <rect x="778" y="382" width="33" height="33" rx="9" fill="#1f6c59"/>
    <path d="M787 398h15M795 391v14" stroke="#f7f6ef" stroke-width="2.3" stroke-linecap="round"/>
    <text x="778" y="452" fill="#214137" font-size="20" font-weight="700">A next experiment</text>
    <text x="778" y="486" fill="#52625b" font-size="16">Try this soon:</text>
    <text x="778" y="525" fill="#1d4f42" font-size="16" font-weight="700">Complete a small product scenario</text>
    <text x="778" y="552" fill="#52625b" font-size="15">Then reflect on the work,</text>
    <text x="778" y="574" fill="#52625b" font-size="15">not only the result.</text>
  </g>
  <rect x="208" y="658" width="784" height="55" rx="8" fill="#17362d"/>
  <circle cx="240" cy="686" r="12" fill="#b9dc72"/>
  <text x="240" y="691" fill="#17362d" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">i</text>
  <text x="268" y="692" fill="#f6f6ef" font-family="Arial, sans-serif" font-size="16" font-weight="700">This overview is a starting point for reflection, not a diagnosis or definitive recommendation.</text>
</svg>
