<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title description">
  <title id="title">The Career Experiment guided demo confirming activities</title>
  <desc id="description">A guided-demo screen where users review activity groups generated from selected experience.</desc>
  <rect width="1200" height="760" fill="#f5f5ee"/>
  <rect width="1200" height="82" fill="#f1f3ec"/>
  <rect x="76" y="26" width="42" height="42" rx="12" fill="#1f6c59"/>
  <text x="97" y="53" fill="#f7f6ef" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">CE</text>
  <text x="134" y="52" fill="#18362e" font-family="Arial, sans-serif" font-size="21" font-weight="700">The Career Experiment</text>
  <text x="208" y="123" fill="#657169" font-family="Arial, sans-serif" font-size="15" font-weight="700">Phase 1 of 3 · Find your existing evidence</text>
  <text x="890" y="123" fill="#657169" font-family="Arial, sans-serif" font-size="15" font-weight="700">Confirm activities</text>
  <rect x="208" y="139" width="784" height="5" rx="3" fill="#d7ddd5"/>
  <rect x="208" y="139" width="390" height="5" rx="3" fill="#1f6c59"/>
  <text x="208" y="208" fill="#246c58" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2">CONFIRM YOUR EXISTING EVIDENCE</text>
  <text x="208" y="267" fill="#17362d" font-family="Georgia, serif" font-size="48">Are these the activities you’ve tried?</text>
  <text x="208" y="309" fill="#65716b" font-family="Arial, sans-serif" font-size="19">Edit anything unclear, remove anything incorrect, and add important work we missed.</text>
  <g font-family="Arial, sans-serif">
    <rect x="208" y="349" width="374" height="316" rx="13" fill="#fbfaf5" stroke="#d8ddd5" stroke-width="2"/>
    <text x="236" y="390" fill="#214137" font-size="22" font-weight="700">Research</text>
    <text x="236" y="416" fill="#758078" font-size="15">3 activities</text>
    <line x1="236" y1="438" x2="554" y2="438" stroke="#d8ddd5" stroke-width="2"/>
    <text x="236" y="474" fill="#2d453b" font-size="17" font-weight="700">Research design</text>
    <text x="236" y="499" fill="#69746e" font-size="15">Seen in Decision Lab</text>
    <line x1="236" y1="520" x2="554" y2="520" stroke="#e3e6df" stroke-width="2"/>
    <text x="236" y="556" fill="#2d453b" font-size="17" font-weight="700">User and customer research</text>
    <text x="236" y="581" fill="#69746e" font-size="15">Seen in Trulioo</text>
    <line x1="236" y1="602" x2="554" y2="602" stroke="#e3e6df" stroke-width="2"/>
    <text x="236" y="638" fill="#2d453b" font-size="17" font-weight="700">Survey design</text>
    <rect x="618" y="349" width="374" height="316" rx="13" fill="#fbfaf5" stroke="#d8ddd5" stroke-width="2"/>
    <text x="646" y="390" fill="#214137" font-size="22" font-weight="700">Analysis</text>
    <text x="646" y="416" fill="#758078" font-size="15">5 activities</text>
    <line x1="646" y1="438" x2="964" y2="438" stroke="#d8ddd5" stroke-width="2"/>
    <text x="646" y="474" fill="#2d453b" font-size="17" font-weight="700">Quantitative data analysis</text>
    <text x="646" y="499" fill="#69746e" font-size="15">Seen across 3 experiences</text>
    <line x1="646" y1="520" x2="964" y2="520" stroke="#e3e6df" stroke-width="2"/>
    <text x="646" y="556" fill="#2d453b" font-size="17" font-weight="700">Insight synthesis</text>
    <text x="646" y="581" fill="#69746e" font-size="15">Seen in Decision Lab</text>
    <line x1="646" y1="602" x2="964" y2="602" stroke="#e3e6df" stroke-width="2"/>
    <text x="646" y="638" fill="#2d453b" font-size="17" font-weight="700">Programming and data tooling</text>
  </g>
  <rect x="208" y="694" width="784" height="48" rx="5" fill="#e7f1ea"/>
  <text x="232" y="724" fill="#456359" font-family="Arial, sans-serif" font-size="16" font-weight="700">14 activities ready to confirm</text>
  <text x="514" y="724" fill="#65716b" font-family="Arial, sans-serif" font-size="16">Next, select the ones you want to review in more detail.</text>
</svg>
