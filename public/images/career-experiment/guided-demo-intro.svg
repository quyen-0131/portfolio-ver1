<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title description">
  <title id="title">The Career Experiment guided demo introduction</title>
  <desc id="description">An introduction screen explaining the three phases of the career decision prototype.</desc>
  <rect width="1200" height="760" fill="#f5f5ee"/>
  <rect width="1200" height="82" fill="#f1f3ec"/>
  <rect x="76" y="26" width="42" height="42" rx="12" fill="#1f6c59"/>
  <text x="97" y="53" fill="#f7f6ef" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">CE</text>
  <text x="134" y="52" fill="#18362e" font-family="Arial, sans-serif" font-size="21" font-weight="700">The Career Experiment</text>
  <text x="208" y="123" fill="#657169" font-family="Arial, sans-serif" font-size="15" font-weight="700">Phase 1 of 3 · Find your existing evidence</text>
  <text x="954" y="123" fill="#657169" font-family="Arial, sans-serif" font-size="15" font-weight="700">Introduction</text>
  <rect x="208" y="139" width="784" height="5" rx="3" fill="#d7ddd5"/>
  <rect x="208" y="139" width="112" height="5" rx="3" fill="#1f6c59"/>
  <text x="208" y="225" fill="#246c58" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2">AN EVIDENCE-BASED CAREER DECISION PROTOTYPE</text>
  <text x="208" y="305" fill="#17362d" font-family="Georgia, serif" font-size="62">Don’t choose a career</text>
  <text x="208" y="372" fill="#17362d" font-family="Georgia, serif" font-size="62">from a quiz. Test it.</text>
  <text x="208" y="429" fill="#55625c" font-family="Arial, sans-serif" font-size="23">Use what you’ve already done to identify what you know and</text>
  <text x="208" y="462" fill="#55625c" font-family="Arial, sans-serif" font-size="23">what you still need to experience before choosing a path.</text>
  <g font-family="Arial, sans-serif">
    <rect x="208" y="512" width="246" height="138" rx="16" fill="#fbfaf5" stroke="#d8ddd5" stroke-width="2"/>
    <rect x="232" y="536" width="30" height="30" rx="9" fill="#e4f0e8"/>
    <text x="247" y="557" fill="#246c58" font-size="15" font-weight="700" text-anchor="middle">1</text>
    <text x="280" y="554" fill="#263f36" font-size="17" font-weight="700">Find your existing</text>
    <text x="280" y="577" fill="#263f36" font-size="17" font-weight="700">evidence</text>
    <text x="232" y="612" fill="#69746e" font-size="15">Start with the activities you</text>
    <text x="232" y="634" fill="#69746e" font-size="15">have already tried.</text>
    <rect x="477" y="512" width="246" height="138" rx="16" fill="#fbfaf5" stroke="#d8ddd5" stroke-width="2"/>
    <rect x="501" y="536" width="30" height="30" rx="9" fill="#e4f0e8"/>
    <text x="516" y="557" fill="#246c58" font-size="15" font-weight="700" text-anchor="middle">2</text>
    <text x="549" y="554" fill="#263f36" font-size="17" font-weight="700">Find your uncertainty</text>
    <text x="501" y="612" fill="#69746e" font-size="15">Name what you want more</text>
    <text x="501" y="634" fill="#69746e" font-size="15">or less of in your work.</text>
    <rect x="746" y="512" width="246" height="138" rx="16" fill="#fbfaf5" stroke="#d8ddd5" stroke-width="2"/>
    <rect x="770" y="536" width="30" height="30" rx="9" fill="#e4f0e8"/>
    <text x="785" y="557" fill="#246c58" font-size="15" font-weight="700" text-anchor="middle">3</text>
    <text x="818" y="554" fill="#263f36" font-size="17" font-weight="700">Plan a career</text>
    <text x="818" y="577" fill="#263f36" font-size="17" font-weight="700">experiment</text>
    <text x="770" y="612" fill="#69746e" font-size="15">Turn one question into a</text>
    <text x="770" y="634" fill="#69746e" font-size="15">small next test.</text>
  </g>
  <rect x="208" y="681" width="784" height="50" rx="2" fill="#e9f1eb"/>
  <rect x="208" y="681" width="5" height="50" fill="#1f6c59"/>
  <text x="235" y="712" fill="#2d453b" font-family="Arial, sans-serif" font-size="16" font-weight="700">Your result</text>
  <text x="343" y="712" fill="#64716b" font-family="Arial, sans-serif" font-size="16">An evidence map and a proposed next test—not a fit score.</text>
</svg>
