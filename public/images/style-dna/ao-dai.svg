  <text x="200" y="452" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#241F1A">áo dài</text>
  <text x="200" y="472" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" letter-spacing="3" fill="#6B6155">SPECIMEN · VIETNAM</text>
