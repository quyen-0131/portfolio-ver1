<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title description">
  <title id="title">French Conversations: build the line</title>
  <desc id="description">The build step shows the learner's line split into shuffled chunks with two decoys, after one failed try that points to where the order went wrong.</desc>
  <rect width="1200" height="760" fill="#0b0f14"/>
  <rect x="300" y="0" width="600" height="760" fill="#10161d"/>
  <circle cx="334" cy="38" r="4" fill="#4fd1c5"/>
  <text x="346" y="43" fill="#eef3f7" font-family="Consolas, monospace" font-size="13" font-weight="700" letter-spacing="2">FRENCH CONVERSATIONS</text>
  <line x1="320" y1="64" x2="880" y2="64" stroke="#212a33"/>
  <g font-family="Consolas, monospace" font-size="11" font-weight="700" letter-spacing="1" text-anchor="middle">
    <circle cx="376" cy="88" r="3.5" fill="#4fd1c5"/><text x="376" y="108" fill="#b4c2cc">SET UP</text>
    <circle cx="488" cy="88" r="3.5" fill="#4fd1c5"/><text x="488" y="108" fill="#b4c2cc">CHOOSE</text>
    <circle cx="600" cy="88" r="3.5" fill="#4fd1c5"/><text x="600" y="108" fill="#b4c2cc">READ</text>
    <circle cx="712" cy="88" r="3.5" fill="#4fd1c5"/><text x="712" y="108" fill="#4fd1c5">BUILD</text>
    <line x1="672" y1="118" x2="752" y2="118" stroke="#4fd1c5"/>
    <circle cx="824" cy="88" r="3.5" fill="none" stroke="#7e909e"/><text x="824" y="108" fill="#7e909e">SAY</text>
  </g>
  <text x="320" y="164" fill="#eef3f7" font-family="Arial, sans-serif" font-size="30" font-weight="700">Now build it</text>
  <text x="320" y="194" fill="#b4c2cc" font-family="Arial, sans-serif" font-size="16">Line 2 of 8. Same sentence you just read — put it back together.</text>
  <text x="320" y="216" fill="#b4c2cc" font-family="Arial, sans-serif" font-size="16">Two pieces don’t belong.</text>
  <text x="320" y="254" fill="#7e909e" font-family="Consolas, monospace" font-size="11" font-weight="700" letter-spacing="1">ALEX</text>
  <rect x="320" y="264" width="500" height="50" rx="16" fill="#171f28" stroke="#2a3540"/>
  <text x="338" y="295" fill="#eef3f7" font-family="Arial, sans-serif" font-size="16">Ah sympa ! J’ai jamais fait le parcours complet là-bas.</text>
  <rect x="320" y="338" width="560" height="64" rx="13" fill="#0b0f14" stroke="#2a3540" stroke-dasharray="5 4"/>
  <g font-family="Arial, sans-serif" font-size="15">
    <rect x="332" y="350" width="112" height="40" rx="11" fill="#173a38" stroke="#4fd1c5"/>
    <text x="388" y="375" fill="#eef3f7" text-anchor="middle">C’était cool,</text>
    <rect x="452" y="350" width="64" height="40" rx="11" fill="#173a38" stroke="#4fd1c5"/>
    <text x="484" y="375" fill="#eef3f7" text-anchor="middle">mais</text>
    <rect x="524" y="350" width="160" height="40" rx="11" fill="#173a38" stroke="#4fd1c5"/>
    <text x="604" y="375" fill="#eef3f7" text-anchor="middle">que ce que je pensais.</text>
  </g>
  <rect x="320" y="420" width="560" height="74" rx="12" fill="#2a2414"/>
  <text x="340" y="448" fill="#e2b25a" font-family="Arial, sans-serif" font-size="16" font-weight="700">Not quite — two tries left</text>
  <text x="340" y="474" fill="#e2b25a" font-family="Arial, sans-serif" font-size="14">The first two pieces are right — it goes wrong after « mais ».</text>
  <g font-family="Arial, sans-serif" font-size="15">
    <rect x="320" y="518" width="112" height="40" rx="11" fill="#171f28" stroke="#2a3540" opacity=".35"/>
    <text x="376" y="543" fill="#eef3f7" text-anchor="middle" opacity=".35">C’était cool,</text>
    <rect x="440" y="518" width="176" height="40" rx="11" fill="#171f28" stroke="#2a3540"/>
    <text x="528" y="543" fill="#eef3f7" text-anchor="middle">beaucoup plus fatigant</text>
    <rect x="624" y="518" width="64" height="40" rx="11" fill="#171f28" stroke="#2a3540" opacity=".35"/>
    <text x="656" y="543" fill="#eef3f7" text-anchor="middle" opacity=".35">mais</text>
    <rect x="696" y="518" width="140" height="40" rx="11" fill="#171f28" stroke="#2a3540"/>
    <text x="766" y="543" fill="#eef3f7" text-anchor="middle">j’ai fait la grasse</text>
    <rect x="320" y="568" width="160" height="40" rx="11" fill="#171f28" stroke="#2a3540" opacity=".35"/>
    <text x="400" y="593" fill="#eef3f7" text-anchor="middle" opacity=".35">que ce que je pensais.</text>
    <rect x="488" y="568" width="130" height="40" rx="11" fill="#171f28" stroke="#2a3540"/>
    <text x="553" y="593" fill="#eef3f7" text-anchor="middle">Franchement,</text>
  </g>
  <text x="320" y="644" fill="#7e909e" font-family="Arial, sans-serif" font-size="13">Decoys come from a different weekend: correct French, wrong context.</text>
  <rect x="320" y="668" width="128" height="46" rx="11" fill="#171f28" stroke="#2a3540"/>
  <text x="384" y="697" fill="#b4c2cc" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">Clear</text>
  <rect x="752" y="668" width="128" height="46" rx="11" fill="#4fd1c5"/>
  <text x="816" y="697" fill="#04121a" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Check</text>
</svg>
