<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title description">
  <title id="title">French Conversations: say it yourself</title>
  <desc id="description">The say step accepts the learner's own answer, gives coaching feedback in English, and then shows one way a French speaker put it.</desc>
  <rect width="1200" height="760" fill="#0b0f14"/>
  <rect x="300" y="0" width="600" height="760" fill="#10161d"/>
  <circle cx="334" cy="38" r="4" fill="#4fd1c5"/>
  <text x="346" y="43" fill="#eef3f7" font-family="Consolas, monospace" font-size="13" font-weight="700" letter-spacing="2">FRENCH CONVERSATIONS</text>
  <line x1="320" y1="64" x2="880" y2="64" stroke="#212a33"/>
  <g font-family="Consolas, monospace" font-size="11" font-weight="700" letter-spacing="1" text-anchor="middle">
    <circle cx="376" cy="88" r="3.5" fill="#4fd1c5"/><text x="376" y="108" fill="#b4c2cc">SET UP</text>
    <circle cx="488" cy="88" r="3.5" fill="#4fd1c5"/><text x="488" y="108" fill="#b4c2cc">CHOOSE</text>
    <circle cx="600" cy="88" r="3.5" fill="#4fd1c5"/><text x="600" y="108" fill="#b4c2cc">READ</text>
    <circle cx="712" cy="88" r="3.5" fill="#4fd1c5"/><text x="712" y="108" fill="#b4c2cc">BUILD</text>
    <circle cx="824" cy="88" r="3.5" fill="#4fd1c5"/><text x="824" y="108" fill="#4fd1c5">SAY</text>
    <line x1="784" y1="118" x2="864" y2="118" stroke="#4fd1c5"/>
  </g>
  <text x="320" y="164" fill="#eef3f7" font-family="Arial, sans-serif" font-size="30" font-weight="700">Now say it yourself</text>
  <text x="320" y="194" fill="#b4c2cc" font-family="Arial, sans-serif" font-size="16">It does not have to be the scripted line — say something true.</text>
  <text x="320" y="232" fill="#7e909e" font-family="Consolas, monospace" font-size="11" font-weight="700" letter-spacing="1">ALEX</text>
  <rect x="320" y="242" width="420" height="50" rx="16" fill="#171f28" stroke="#2a3540"/>
  <text x="338" y="273" fill="#eef3f7" font-family="Arial, sans-serif" font-size="16">Ah sympa ! C’était comment ?</text>
  <text x="880" y="318" fill="#7e909e" font-family="Consolas, monospace" font-size="11" font-weight="700" letter-spacing="1" text-anchor="end">YOU</text>
  <rect x="440" y="328" width="440" height="50" rx="16" fill="#173a38" stroke="#2f6b66"/>
  <text x="458" y="359" fill="#eef3f7" font-family="Arial, sans-serif" font-size="16">C’était bien. J’ai marché beaucoup.</text>
  <rect x="320" y="402" width="560" height="168" rx="12" fill="#2a2414"/>
  <text x="340" y="432" fill="#e2b25a" font-family="Arial, sans-serif" font-size="17" font-weight="700">That works, but it’s a dead end</text>
  <text x="340" y="460" fill="#e2b25a" font-family="Arial, sans-serif" font-size="14">It answers the question, but leaves Alex nothing to react to.</text>
  <text x="340" y="496" fill="#b4c2cc" font-family="Consolas, monospace" font-size="11" font-weight="700" letter-spacing="1">FROM TODAY’S PHRASES</text>
  <text x="340" y="520" fill="#eef3f7" font-family="Arial, sans-serif" font-size="14">« plus fatigant que ce que je pensais » — say how it surprised you.</text>
  <text x="340" y="550" fill="#eef3f7" font-family="Arial, sans-serif" font-size="14">Try adding how long it took.</text>
  <rect x="320" y="590" width="560" height="78" rx="12" fill="#171f28" stroke="#2a3540"/>
  <text x="340" y="618" fill="#7e909e" font-family="Consolas, monospace" font-size="11" font-weight="700" letter-spacing="1">ONE WAY A FRENCH SPEAKER PUT IT</text>
  <text x="340" y="646" fill="#eef3f7" font-family="Arial, sans-serif" font-size="14">C’était cool, mais beaucoup plus fatigant que ce que je pensais.</text>
  <rect x="320" y="692" width="140" height="46" rx="11" fill="#171f28" stroke="#2a3540"/>
  <text x="390" y="721" fill="#b4c2cc" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">Try again</text>
  <rect x="752" y="692" width="128" height="46" rx="11" fill="#4fd1c5"/>
  <text x="816" y="721" fill="#04121a" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Next line</text>
</svg>
